[package]
name = "sftpinguin"
version = "0.1.0"
description = "SFTPinguin – a modern, minimalist file transfer client"
authors = ["SFTPinguin contributors"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "sftpinguin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "io-util", "net", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
async-trait = "0.1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
log = "0.4"
filetime = "0.2"
base64 = "0.22"
percent-encoding = "2"
quick-xml = "0.42"
# SSH / SFTP
russh = { version = "0.63", default-features = false, features = ["flate2", "ring", "rsa"] }
russh-sftp = "3"
# FTP / FTPS
suppaftp = { version = "12", features = ["tokio-rustls-ring", "deprecated"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
ring = "0.17"
x509-parser = { version = "0.18", default-features = false }
# WebDAV
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"] }
# S3
rust-s3 = { version = "0.37", default-features = false, features = ["with-tokio", "fail-on-err"] }
# TLS for rust-s3's HTTP client (ring based, no platform verifier)
reqwest012 = { package = "reqwest", version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
keyring = "4"
trash = "5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
